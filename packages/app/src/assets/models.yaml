# Curated adapter-compatible models. Edit this file to change the published defaults.
# A private copy in the Slopify data directory reloads automatically.
# Omitted pricing means unknown, never free. Provider concurrency is capped at five.
schemaVersion: 1
updatedAt: 2026-09-10
providers:
  openrouter:
    maxConcurrent: 3
  claude-code:
    maxConcurrent: 3
  codex:
    maxConcurrent: 3
  gemini:
    maxConcurrent: 3
  elevenlabs:
    maxConcurrent: 3
  openai-tts:
    maxConcurrent: 3
  cartesia:
    maxConcurrent: 3
  inworld:
    maxConcurrent: 5
  fal:
    maxConcurrent: 3
  replicate:
    maxConcurrent: 3
  openai-image:
    maxConcurrent: 3
  google-image:
    maxConcurrent: 3
