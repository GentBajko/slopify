# Curated adapter-compatible models. Edit this file to change the published defaults.
# A private copy in the Slopify data directory reloads automatically.
# Omitted pricing means unknown, never free. Provider concurrency is capped at five.
schemaVersion: 1
updatedAt: 2026-09-26
providers:
  openrouter:
    maxConcurrent: 3
  elevenlabs:
    maxConcurrent: 3
  openai-tts:
