<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Slopify Studio</title>
    <style>
      @font-face { font-family: "Barlow"; font-weight: 500; src: url("fonts/barlow-latin-500-normal.woff2") format("woff2"); }
      @font-face { font-family: "Barlow"; font-weight: 600; src: url("fonts/barlow-latin-600-normal.woff2") format("woff2"); }
      @font-face { font-family: "Barlow"; font-weight: 700; src: url("fonts/barlow-latin-700-normal.woff2") format("woff2"); }
      /* Slopify's own colours: dark by default, as the app is. */
      :root {
        --ground: #121214; --surface: #19191c; --raised: #212125; --line: #2a2a30;
        --ink: #ece9e2; --ink-2: #a9a69e; --ink-3: #8e8c84;
        --accent: #a6d45c; --accent-strong: #86b33c; --on-accent: #15200a; --accent-tint: rgb(166 212 92 / 0.12);
        --waiting: #e8a84c; --waiting-tint: rgb(232 168 76 / 0.14); --danger: #f08073; --danger-tint: rgb(240 128 115 / 0.14);
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      body { margin: 0; width: 380px; background: var(--ground); color: var(--ink); font: 500 13px/1.4 "Barlow", system-ui, sans-serif; }
      button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
      button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

      header { display: flex; align-items: center; gap: 8px; padding: 12px 14px; background: var(--surface); border-bottom: 1px solid var(--line); }
      .mark { width: 22px; height: 22px; flex: none; }
      header h1 { flex: 1; min-width: 0; margin: 0; font-size: 15px; font-weight: 700; letter-spacing: 0.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; color: var(--ink-2); border: 1px solid var(--line); }
      .chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); }
      .chip.on::before { background: var(--accent); }
      .chip.off { color: var(--waiting); border-color: var(--waiting); }
      .chip.off::before { background: var(--waiting); }
      .icon { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 6px; color: var(--ink-2); }
      .icon:hover { background: var(--raised); color: var(--ink); }
      .icon svg { width: 16px; height: 16px; }

      main { max-height: 470px; overflow-y: auto; }
      .section { padding: 10px 14px 4px; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }
      ul { list-style: none; margin: 0; padding: 0 6px 6px; }
      li + li { border-top: 1px solid var(--line); }

      /* A project: title, dots for its uploads (filled: on YouTube), and what comes next. */
      .project { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; width: 100%; padding: 10px 8px; border-radius: 8px; text-align: left; }
      .project:hover { background: var(--surface); }
      .project .name { font-weight: 600; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
      .project .chev { grid-row: span 2; align-self: center; color: var(--ink-3); }
      .sub { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-2); }
      .dots { display: inline-flex; gap: 3px; }
      .dots i { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--ink-3); }
      .dots i.long { border-radius: 2px; width: 12px; }
      .dots i.up { background: var(--accent); border-color: var(--accent); }
      .dots i.late { border-color: var(--waiting); }

      /* An upload: what it is, its title, its state, and its own action. */
      .upload { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 10px; padding: 9px 8px; }
      .upload .kind { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); }
      .upload .name { grid-column: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .upload .state { grid-column: 1; font-size: 12px; color: var(--ink-2); }
      .upload .act { grid-column: 2; grid-row: 1 / span 3; }
      .state.done { color: var(--accent); }
      .state.late { color: var(--waiting); }
      .state.muted { color: var(--ink-3); }

      .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 6px 12px; border-radius: 7px; font-weight: 600; border: 1px solid var(--line); background: var(--raised); }
      .btn:hover { border-color: var(--ink-3); }
      .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
      .btn.primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
      .btn.wide { width: calc(100% - 28px); margin: 12px 14px 4px; padding: 9px 12px; }
      .btn:disabled { opacity: 0.55; cursor: default; }

      .note { margin: 0; padding: 14px; color: var(--ink-2); }
      .note.error { color: var(--danger); }
      .empty { padding: 28px 18px; text-align: center; color: var(--ink-2); }
      .empty strong { display: block; margin-bottom: 4px; color: var(--ink); font-size: 14px; }

      footer { display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: var(--surface); border-top: 1px solid var(--line); }
      footer .status { flex: 1; min-width: 0; font-size: 12px; color: var(--ink-3); }
      .link { color: var(--ink-2); font-size: 12px; font-weight: 600; padding: 4px 6px; border-radius: 6px; }
      .link:hover { color: var(--ink); background: var(--raised); }
    </style>
  </head>
  <body>
    <header>
      <button id="back" type="button" class="icon" hidden aria-label="Back to projects">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <img id="mark" class="mark" src="icons/icon-48.png" alt="" />
      <h1 id="heading">Ready to upload</h1>
      <span id="paired" class="chip">…</span>
      <button id="settings" type="button" class="icon" aria-label="Pairing and settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </header>
    <main id="main"><p class="note">Loading…</p></main>
    <footer>
      <span id="status" class="status">Studio's numbers come in once a day.</span>
      <button id="stats" type="button" class="link">Read Studio now</button>
      <button id="open" type="button" class="link">Open Slopify</button>
    </footer>
    <script src="popup.js"></script>
  </body>
</html>
