name: Release

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Verify tag matches package version
        run: node -e "const version=require('./packages/app/package.json').version; if (!/^\d+\.\d+\.\d+$/.test(version) || process.env.GITHUB_REF_NAME !== version) { throw new Error('Stable tag ' + process.env.GITHUB_REF_NAME + ' does not match package version ' + version); }"

  # The tagged commit must already have passed CI on main; the release does not run the
  # suite a second time. Push main, wait for CI, then tag that commit.
  verify:
    needs: metadata
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require a passing CI run on main for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${{ github.sha }}&branch=main&status=success&per_page=1" --jq '.total_count')
          if [ "$passed" -lt 1 ]; then
            echo "::error::No successful CI run on main for ${{ github.sha }}. Push main, wait for CI to pass, then tag that commit."
            exit 1
          fi

  publish:
    needs: verify
    runs-on: ubuntu-latest
    # OIDC authenticates npm trusted publishing and signs provenance. Keep it off the
    # dependency-installing verification jobs, which need only read the repository.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run build
      - run: npm publish --provenance --access public --workspace @gentbajko/slopify

  container:
    needs: [verify, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/gentbajko/slopify:${{ github.ref_name }}
            ghcr.io/gentbajko/slopify:latest
          labels: |
            org.opencontainers.image.source=https://github.com/GentBajko/slopify
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
