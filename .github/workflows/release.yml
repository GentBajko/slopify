name: Release

on:
  push:
    tags:
      - 'v*'

# id-token is what authenticates the publish and signs the provenance attestation:
# the npmjs.com package must have this workflow registered as a trusted publisher,
# because no NPM_TOKEN is set here.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run build
      - run: npm publish --provenance --access public --workspace slopify
