name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # The build is the release artifact: it is what copies packages/web's output into
      # the package that npm publishes, so a tag must never be the first time it runs.
      - run: npm run build
      - run: npm audit --audit-level=high

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run build
      # Exercise native executable paths, recovery, WAV exports and narrated/silent renders.
      - run: npx vitest run packages/app/src/adapters/ffmpeg.test.ts packages/app/src/main.test.ts packages/app/test/e2e/skeleton.test.ts packages/app/test/e2e/optional-outputs.test.ts packages/app/src/adapters/alignment packages/app/src/slices/fonts packages/app/src/edge/http/fonts.test.ts packages/app/src/slices/subtitles
      - run: npx vitest run packages/app/test/video-render.test.ts -t "real subtitle export"
      - run: npx vitest run packages/app/src/kernel/cli-command.test.ts packages/app/src/adapters/llm packages/app/src/slices/settings/cli-paths.test.ts packages/app/src/slices/settings/cli-status.test.ts packages/app/src/adapter-registry-paths.test.ts
      - run: npx vitest run packages/app/src/catalog packages/app/src/kernel/runner/queue.test.ts packages/app/src/slices/batch packages/app/src/slices/narration/plan.test.ts
