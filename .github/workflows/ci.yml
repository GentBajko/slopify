name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # The build is the release artifact: it is what copies packages/web's output into
      # the package that npm publishes, so a tag must never be the first time it runs.
      - run: npm run build
      - run: npm audit --audit-level=high
