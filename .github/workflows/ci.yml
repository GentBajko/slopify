name: CI

on:
  push:
  pull_request:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # The build is the release artifact: it is what copies packages/web's output into
      # the package that npm publishes, so a tag must never be the first time it runs.
      - run: npm run build
      - run: npm audit --audit-level=high

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run build
      # Verify the package can be launched both through npx and a global npm install.
      - run: node packages/app/scripts/install-smoke.mjs
      # Exercise native executable paths, recovery, WAV exports and narrated/silent renders.
      - run: npx vitest run packages/app/src/adapters/ffmpeg.test.ts packages/app/src/main.test.ts packages/app/test/e2e/skeleton.test.ts packages/app/test/e2e/optional-outputs.test.ts packages/app/test/e2e/editable-projects.test.ts packages/app/test/e2e/play-drafts.test.ts packages/app/test/e2e/review-checkpoints.test.ts packages/app/test/review-checkpoints-restart.test.ts packages/app/src/adapters/alignment packages/app/src/slices/fonts packages/app/src/edge/http/fonts.test.ts packages/app/src/slices/subtitles
      - run: npx vitest run packages/app/test/video-render.test.ts -t "real subtitle export"
      - run: npx vitest run packages/app/src/kernel/cli-command.test.ts packages/app/src/adapters/llm packages/app/src/slices/settings/cli-paths.test.ts packages/app/src/slices/settings/cli-status.test.ts packages/app/src/adapter-registry-paths.test.ts
      - run: npx vitest run packages/app/src/catalog packages/app/src/kernel/runner/queue.test.ts packages/app/src/slices/batch packages/app/src/slices/narration/plan.test.ts packages/app/src/slices/narration/chunk.test.ts packages/app/src/slices/narration/preparation.test.ts packages/app/src/slices/narration/steering.test.ts packages/app/src/edge/open-folder.test.ts packages/app/src/edge/http/files.test.ts packages/app/src/edge/http/storage.test.ts packages/app/src/edge/http/diagnostics.test.ts packages/app/src/edge/http/schedules.test.ts packages/app/src/slices/schedules packages/app/src/slices/video/subtitle-only.test.ts
      - run: npx vitest run packages/app/src/slices/storage/assets.test.ts packages/app/src/slices/storage/prepare.test.ts packages/app/src/slices/storage/reconcile.test.ts packages/app/src/slices/storage/portable.test.ts packages/app/src/slices/revisions packages/app/src/slices/rebuild packages/app/test/revision-rebuild.test.ts packages/app/test/revision-narration.test.ts packages/app/test/revision-provided.test.ts packages/app/test/revision-restart.test.ts packages/app/test/revision-article-recovery.test.ts packages/app/test/revision-bundle-recovery.test.ts packages/app/test/revision-research-rebuild.test.ts packages/app/test/revision-preparation.test.ts packages/app/test/revision-preparation-restart.test.ts packages/app/test/revision-preparation-control.test.ts packages/app/test/revision-preparation-validation.test.ts packages/app/test/preparation-saved-workflows.test.ts

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: docker build -t slopify:smoke .
      - run: bash packages/app/scripts/container-smoke.sh
      - run: node packages/app/scripts/host-cli-smoke.mjs
      - run: node packages/app/scripts/docker-projects-smoke.mjs
