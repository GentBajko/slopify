version: 2

updates:
  # Root only, and deliberately so. This repo has one hoisted package-lock.json, and
  # Dependabot expands the root manifest's `workspaces` globs to reach every member.
  # Listing `/packages/*` as separate directories was tried and broke every PR it
  # opened: those entries bump a member's package.json without updating the root lock,
  # so CI fails with `npm ci` EUSAGE, "lock file's X does not satisfy X".
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
